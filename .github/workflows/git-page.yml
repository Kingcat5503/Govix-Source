name: Build & Publish ISO with Artifact Link

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read    # required to fetch artifact download URL

jobs:

  build-iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git base-devel wget curl
          pacman-key --init
          pacman-key --populate archlinux

      - name: Copy releng profile
        run: cp -r /usr/share/archiso/configs/releng ./releng

      - name: Remove broken packages
        run: sed -i '/maliit-keyboard/d' releng/packages.x86_64

      - name: Build ISO
        run: |
          mkarchiso -v -w work -o out ./releng
          ls -lh out

      - name: Upload ISO artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: govix-iso
          path: out/*.iso
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build-iso

    steps:
      - name: Get artifact download URL
        id: artifact
        run: |
          ARTIFACT=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name=="govix-iso") | .id')

          URL=$(gh api \
            repos/${{ github.repository }}/actions/artifacts/$ARTIFACT \
            --jq '.archive_download_url')

          echo "url=$URL" >> $GITHUB_OUTPUT

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Update GitHub Pages index.html
        run: |
          URL="${{ steps.artifact.outputs.url }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat > index.html <<EOF
          <html>
          <body style="font-family: sans-serif;">
            <h1>Govix Latest ISO</h1>
            <p><a href="$URL">Download ISO (Artifact Link)</a></p>
            <p>Auto-updated on: $DATE</p>
            <p>This link always provides the newest ISO artifact.</p>
          </body>
          </html>
          EOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update ISO download link" || true
          git push origin gh-pages
