name: Publish ISO

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: govix-archiso
          path: iso/

      - name: Prepare site
        run: |
          rm -rf site
          mkdir -p site
          cp iso/*.iso site/

          echo "<h1>Govix ISO Download</h1>" > site/index.html
          echo "<p>Latest build available below.</p>" >> site/index.html
          echo "<a href='./$(ls iso)' download>Download ISO</a>" >> site/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true
