name: Update Govix ISO Download Page

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-page]

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build metadata
        uses: actions/download-artifact@v4
        with:
          name: govix-meta
          path: page

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Update downloads page
        run: |
          set -e
          mkdir -p gh-pages
          cp page/build.json gh-pages/latest.json

          cd gh-pages
          if [ ! -f builds.json ]; then echo "[]" > builds.json; fi
          jq ". + [$(cat latest.json)] | sort_by(.date) | reverse | .[:5]" builds.json > tmp.json && mv tmp.json builds.json
          cd ..

          bash .github/pages/pagegen.sh

          cd gh-pages
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add index.html builds.json latest.json style.css .nojekyll || true
          git commit -m "Update Govix download page ($(date +'%Y-%m-%d %H:%M:%S'))" || echo "No changes to commit"
          git push origin gh-pages || echo "Push skipped"
