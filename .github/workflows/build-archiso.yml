name: Build and Release Arch ISO

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    outputs:
      release: ${{ steps.cfg.outputs.release }}
      tag: ${{ steps.cfg.outputs.tag }}
      title: ${{ steps.cfg.outputs.title }}
      body: ${{ steps.cfg.outputs.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read workflow configuration
        id: cfg
        run: |
          set -e
          source .github/workflow.conf

          DATE=$(date +'%Y.%m.%d')
          TAG=$(date +"${TAG_FORMAT}${DATE}")

          # Build count logic
          if [ "${INCREMENT_BUILD_COUNT}" = "true" ]; then
            COUNT_FILE=".github/buildcount-${DATE}.txt"
            if [ ! -f "$COUNT_FILE" ]; then echo 0 > "$COUNT_FILE"; fi
            COUNT=$(($(cat "$COUNT_FILE")+1))
            echo $COUNT > "$COUNT_FILE"
            TAG="${TAG}${COUNT}"

            if [ "${RELEASE}" = "true" ]; then
              git config user.name "github-actions"
              git config user.email "actions@github.com"
              git add "$COUNT_FILE"
              git commit -m "Increment build count for ${DATE}" || true
              git push || true
            fi
          fi

          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git base-devel wget curl
          pacman-key --init
          pacman-key --populate archlinux

      - name: Add custom GitLab repo (optional)
        run: |
          echo '[garch-repo]' >> /etc/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> /etc/pacman.conf
          echo 'Server = https://gitlab.com/Kingcat5503/garch-repo/-/raw/main/$arch' >> /etc/pacman.conf
          pacman -Sy

      - name: Build ISO
        run: |
          sudo mkarchiso -v -w work -o out releng

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: govix-archiso
          path: out/*.iso

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.outputs.release == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: govix-archiso
          path: dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "${{ needs.build.outputs.title }} ${{ needs.build.outputs.tag }}"
          body: ${{ needs.build.outputs.body }}
          draft: false
          prerelease: false
          files: dist/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
