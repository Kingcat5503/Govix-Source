name: Build & Update Govix ISO Download Page

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also create a GitHub Release?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Govix Arch ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git base-devel wget curl jq
          pacman-key --init
          pacman-key --populate archlinux

      - name: Add custom GitLab repo (optional)
        run: |
          echo '[garch-repo]' >> /etc/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> /etc/pacman.conf
          echo 'Server = https://gitlab.com/Kingcat5503/garch-repo/-/raw/main/$arch' >> /etc/pacman.conf
          pacman -Sy

      - name: Build ISO
        run: |
          mkdir -p out
          mkarchiso -v -w work -o out releng

      - name: Upload ISO artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: govix-iso
          path: out/*.iso
          retention-days: 30

      - name: Generate build metadata
        id: meta
        run: |
          DATE=$(date +'%Y-%m-%d %H:%M')
          ISO_FILE=$(basename out/*.iso)
          LINK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          mkdir -p page
          cat > page/build.json <<EOF
          {
            "date": "${DATE}",
            "file": "${ISO_FILE}",
            "link": "${LINK}"
          }
          EOF

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
          
      - name: Update downloads page (from template system)
        run: |
          set -e
          mkdir -p gh-pages
          cp page/build.json gh-pages/latest.json

          cd gh-pages
          if [ ! -f builds.json ]; then echo "[]" > builds.json; fi
          jq ". + [$(cat latest.json)] | sort_by(.date) | reverse | .[:5]" builds.json > tmp.json && mv tmp.json builds.json
          cd ..

          bash .github/pages/pagegen.sh

          cd gh-pages
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add index.html builds.json latest.json style.css .nojekyll || true
          git commit -m "Update Govix download page ($(date +'%Y-%m-%d %H:%M:%S'))" || echo "No changes to commit"
          git push origin gh-pages || echo "Push skipped"


  release:
    name: Create GitHub Release (optional)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.release == 'true' }}

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Govix ISO Build #${{ github.run_number }}"
          body: |
            🚀 **Govix Arch Linux ISO Build**
            
            View all builds and download links here:
            🔗 [Govix Downloads Page](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
