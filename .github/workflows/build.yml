name: Build & Publish ISO

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:

  build-iso:
    name: Build Custom Arch ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git base-devel wget curl
          pacman-key --init
          pacman-key --populate archlinux

      - name: Add custom GitLab repo (optional)
        run: |
          echo '[garch-repo]' >> /etc/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> /etc/pacman.conf
          echo 'Server = https://gitlab.com/Kingcat5503/garch-repo/-/raw/main/$arch' >> /etc/pacman.conf
          pacman -Sy

      - name: Copy releng profile
        run: |
          cp -r /usr/share/archiso/configs/releng ./releng
          sed -i '/maliit-keyboard/d' releng/packages.x86_64 || true

      - name: Build ISO
        run: |
          mkarchiso -v -w work -o out ./releng

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: govix-archiso
          path: out/*.iso


  publish:
    name: Publish ISO to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-iso

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: govix-archiso
          path: iso/

      - name: Prepare site directory
        run: |
          rm -rf site
          mkdir -p site

          cp iso/*.iso site/
          ISOFILE=$(ls iso)

          echo "<h1>Govix ISO Download</h1>" > site/index.html
          echo "<p>Latest ISO:</p>" >> site/index.html
          echo "<a href='./$ISOFILE' download>Download $ISOFILE</a>" >> site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true
