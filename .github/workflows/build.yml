name: Build ISO

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Custom Arch ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso \
            git \
            base-devel \
            wget \
            curl \
            dosfstools \
            squashfs-tools \
            mtools \
            jq

          pacman-key --init
          pacman-key --populate archlinux

      - name: Add custom GitLab repo (optional)
        run: |
          echo '[garch-repo]' >> /etc/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> /etc/pacman.conf
          echo 'Server = https://gitlab.com/Kingcat5503/garch-repo/-/raw/main/$arch' >> /etc/pacman.conf
          pacman -Sy || true

      - name: Copy releng profile
        run: |
          cp -r /usr/share/archiso/configs/releng ./releng

      - name: Build ISO
        run: |
          mkarchiso -v -w work -o out ./releng

      - name: Upload ISO artifact
        id: artifact_upload
        uses: actions/upload-artifact@v4
        with:
          name: govix-archiso
          path: out/*.iso
          retention-days: 15
  publish:
    name: Publish ISO Metadata
    runs-on: ubuntu-latest
    needs: build-iso

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: govix-archiso
          path: iso/

      - name: Generate artifact.json
        run: |
          FILE=$(ls iso)
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ARTIFACT_URL="https://nightly.link/${{ github.repository }}/actions/artifacts"

          echo "{
            \"file\": \"${FILE}\",
            \"timestamp\": \"${TIME}\",
            \"url\": \"${ARTIFACT_URL}\"
          }" > artifact.json

      - name: Deploy artifact.json to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          keep_files: true
