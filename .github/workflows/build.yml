name: Build ISO

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Custom Arch ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso \
            git \
            base-devel \
            wget \
            curl \
            dosfstools \
            squashfs-tools \
            mtools

          pacman-key --init
          pacman-key --populate archlinux

      - name: Add custom GitLab repo (optional)
        run: |
          echo '[garch-repo]' >> /etc/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> /etc/pacman.conf
          echo 'Server = https://gitlab.com/Kingcat5503/garch-repo/-/raw/main/$arch' >> /etc/pacman.conf
          pacman -Sy || true

      - name: Copy releng profile
        run: |
          cp -r /usr/share/archiso/configs/releng ./releng

      - name: Build ISO
        run: |
          mkarchiso -v -w work -o out ./releng

      - name: Upload ISO artifact
        id: artifact_upload
        uses: actions/upload-artifact@v4
        with:
          name: govix-archiso
          path: out/*.iso
          retention-days: 7

      # Fetch artifact metadata from GitHub API
      - name: Get artifact download URL
        id: artifact_url
        run: |
          ARTIFACT_DATA=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts)

          URL=$(echo "$ARTIFACT_DATA" | jq -r '.artifacts[0].archive_download_url')

          echo "download_url=$URL" >> $GITHUB_OUTPUT

      # Write new JSON file with updated link
      - name: Update artifact.json
        run: |
          echo "{\"artifact_link\": \"${{ steps.artifact_url.outputs.download_url }}\"}" > artifact.json

      # Commit and push updated JSON
      - name: Commit & push update
        run: |
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git add artifact.json
          git commit -m "Update artifact.json with new ISO link"
          git push
