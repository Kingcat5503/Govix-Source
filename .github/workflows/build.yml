name: Build and Publish ISO

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Custom Arch ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git base-devel wget curl
          pacman-key --init
          pacman-key --populate archlinux

      - name: Add custom GitLab repo (optional)
        run: |
          echo '[garch-repo]' >> /etc/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> /etc/pacman.conf
          echo 'Server = https://gitlab.com/Kingcat5503/garch-repo/-/raw/main/$arch' >> /etc/pacman.conf
          pacman -Sy || true   # avoid hard failure

      - name: Copy releng profile
        run: cp -r /usr/share/archiso/configs/releng ./releng

      - name: Build ISO
        run: mkarchiso -v -w work -o out ./releng

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: govix-archiso
          path: out/*.iso


  publish:
    name: Publish ISO to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-iso    # MUST match job id above

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: gh-pages

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: govix-archiso
          path: iso/

      - name: Prepare site contents
        run: |
          rm -rf *
          mkdir -p .
          cp iso/*.iso .
          ISOFILE=$(ls iso)

          echo "<h1>Govix ISO Download</h1>" > index.html
          echo "<p>Latest ISO:</p>" >> index.html
          echo "<a href='./$ISOFILE' download>Download $ISOFILE</a>" >> index.html

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add --all
          git commit -m "Update ISO" || true
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
