name: Build ISO

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Custom Arch ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso \
            git \
            base-devel \
            wget \
            curl \
            dosfstools \
            squashfs-tools \
            mtools \
            jq

          pacman-key --init
          pacman-key --populate archlinux

      - name: Add Garch Repo
        run: |
          echo '[garch-repo]' >> /etc/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> /etc/pacman.conf
          echo 'Server = https://gitlab.com/Kingcat5503/garch-repo/-/raw/main/$arch' >> /etc/pacman.conf
          pacman -Sy || true
      - name: Add Chaotic Repo
        run: |
         sudo pacman -S chaotic-aur-repo --noconfirm
         sudo pacman -Sy || true

      - name: Copy releng profile
        run: |
          cp -r /usr/share/archiso/configs/releng ./releng

      - name: Build ISO
        run: |
          mkarchiso -v -w work -o out ./releng

      - name: Upload ISO artifact
        id: artifact_upload
        uses: actions/upload-artifact@v4
        with:
          name: govix-archiso
          path: out/*.iso
          retention-days: 15