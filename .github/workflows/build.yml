name: Build Govix Arch ISO

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    name: Build Govix Arch ISO
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git base-devel wget curl jq
          pacman-key --init
          pacman-key --populate archlinux

      - name: Add custom GitLab repo (optional)
        run: |
          echo '[garch-repo]' >> /etc/pacman.conf
          echo 'SigLevel = Optional TrustAll' >> /etc/pacman.conf
          echo 'Server = https://gitlab.com/Kingcat5503/garch-repo/-/raw/main/$arch' >> /etc/pacman.conf
          pacman -Sy

      - name: Build ISO
        run: |
          mkdir -p out
          mkarchiso -v -w work -o out releng

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: govix-iso
          path: out/*.iso
          retention-days: 30
