# === Workflow Configuration ===
# Controls which workflow stages run when you push or manually trigger controller.yml

# Build ISO from ArchISO
BUILD=true

# Create a GitHub release after build
RELEASE=false

# Update GitHub Pages download page
PAGES=false


# === Optional Release Metadata ===
# Used only if RELEASE=true
TAG_FORMAT="v%Y.%m.%d"
RELEASE_TITLE="Govix ISO Release"
RELEASE_BODY="Automated Govix Arch ISO Release."
