# === Workflow Configuration ===
# Edit before you push your commit

# If true → workflow will build and release.
# If false → only build and upload artifact.
RELEASE=true

# ISO output tag format
TAG_FORMAT="v%Y.%m.%d-build"

# Custom release title and description
RELEASE_TITLE="Govix ISO"
RELEASE_BODY="🚀 Govix Arch ISO with KDE Plasma and system enhancements."

# Optional: keep track of build count (per day)
INCREMENT_BUILD_COUNT=true
# If true → increments build count on each run per day.
# If false → resets build count to 1 on each run per day.